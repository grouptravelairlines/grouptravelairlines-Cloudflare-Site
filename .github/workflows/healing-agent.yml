name: GTA Healing Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "3-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gta-healing-agent
  cancel-in-progress: true

jobs:
  heal:
    name: Check and Heal Group Travel Airlines
    runs-on: ubuntu-latest

    env:
      SITE_URL: https://grouptravelairlines.pages.dev
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/healing-agent/package.json

      - name: Install Healing Agent dependencies
        working-directory: scripts/healing-agent
        run: npm install

      - name: Install Playwright Chromium
        working-directory: scripts/healing-agent
        run: npx playwright install --with-deps chromium

      - name: Run GTA Healing Agent
        run: node scripts/healing-agent.mjs

      - name: Upload healing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gta-healing-report
          path: healing-report.json
          if-no-files-found: ignore

      - name: Commit safe healing changes
        run: |
          if git diff --quiet; then
            echo "No healing changes detected."
            exit 0
          fi

          git config user.name "GTA Healing Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add robots.txt sitemap.xml
          git commit -m "Auto-heal SEO files"
          git push
