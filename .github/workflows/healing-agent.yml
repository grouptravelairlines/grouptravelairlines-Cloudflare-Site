name: GTA Healing Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: gta-healing-agent
  cancel-in-progress: true

jobs:
  check-and-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SITE_URL: https://grouptravelairlines.pages.dev
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/healing-agent/package.json
          package-manager-cache: false

      - name: Install Healing Agent dependencies
        working-directory: scripts/healing-agent
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: scripts/healing-agent
        run: npx playwright install --with-deps chromium

      - name: Run GTA Healing Agent
        id: healer
        continue-on-error: true
        working-directory: scripts/healing-agent
        run: node healing-agent.mjs

      - name: Upload healing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gta-healing-report
          path: healing-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit safe healing changes
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml robots.txt; then
            echo "No safe healing changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml robots.txt
          git commit -m "chore: update public sitemap and robots"
          git push

      - name: Finalize workflow status
        if: always()
        env:
          HEALER_OUTCOME: ${{ steps.healer.outcome }}
        shell: bash
        run: |
          echo "Healing Agent result: ${HEALER_OUTCOME}"

          if [ ! -f "healing-report.json" ]; then
            echo "healing-report.json was not created."
            echo "The Healing Agent did not complete normally."
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('healing-report.json', 'utf8'));
          console.log(JSON.stringify(report, null, 2));
          process.exit(Array.isArray(report.failures) && report.failures.length > 0 ? 1 : 0);
          NODE
